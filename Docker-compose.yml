  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
    ports:
      - "8083:8080"
    command:
      - start-dev
    depends_on:
      - postgres
    networks:
      - online-gallery-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - online-gallery-network

  #  discovery-server:
  #    build:
  #      context: .
  #      dockerfile: discovery-server/Dockerfile.discovery-server
  #    ports:
  #      - "8761:8761"
  #    environment:
  #      SPRING_PROFILES_ACTIVE: docker
  #    networks:
  #      - online-gallery-network

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile.api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    #      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    #    depends_on:
    #      - discovery-server
    networks:
      - online-gallery-network

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile.user-service
    ports:
      - "8081:8080"
    networks:
      - online-gallery-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    #      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    depends_on: [ postgres ]

  artwork-service:
    build:
      context: .
      dockerfile: artwork-service/Dockerfile.artwork-service
    ports:
      - "8082:8080"
    networks:
      - online-gallery-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/artworks_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
    #      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka
    depends_on: [ postgres ]

  tests:
    build:
      context: .
      dockerfile: user-service/Dockerfile.test
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password

volumes:
  postgres_data:
networks:
  online-gallery-network:
    driver: bridge